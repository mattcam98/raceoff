services:
  raceoff:
    build: .
    image: raceoff:local
    container_name: raceoff
    ports:
      - "${RACEOFF_PORT:-3300}:3300"
    environment:
      TZ: ${TZ:-Europe/Malta}
      # The address phones should open, e.g. https://race.example.com. Empty: whatever the TV was opened with.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Reverse proxies in front of the app: 0 if exposed directly, 1 behind one proxy.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Track records and the Hall of Fame.
      - raceoff-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  raceoff-data:
