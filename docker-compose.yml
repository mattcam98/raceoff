# Nothing to configure here: RaceOff is set up from its own settings page, /settings.
# On the first start it prints a one-time setup code in its log (docker logs raceoff).
services:
  raceoff:
    build: .
    image: raceoff:local
    container_name: raceoff
    ports:
      - "3300:3300"
    environment:
      TZ: Europe/Malta
    volumes:
      # Settings, track records and open rooms. Everything else in the container is read-only.
      - raceoff-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  raceoff-data:
